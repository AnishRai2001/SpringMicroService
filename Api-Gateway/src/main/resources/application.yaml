spring:
  application:
    name: API-Gateway

  cloud:
    gateway:
      routes:
        - id: property-service
          uri: lb://PROPERTYSERVICE
          predicates:
            - Path=/property/**
          filters:
            - RewritePath=/property/(?<segment>.*), /${segment}

        - id: auth-service-app
          uri: lb://JWTSECURITY
          predicates:
            - Path=/auth/**
          filters:
            - RewritePath=/auth/(?<segment>.*), /${segment}

        - id: microservice-api-1
          uri: lb://MICROSERVICES1
          predicates:
            - Path=/micro1/**
          filters:
            - RewritePath=/micro1/(?<segment>.*), /${segment}

server:
  port: 5555

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
